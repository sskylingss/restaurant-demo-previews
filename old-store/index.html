<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Old Store Cafe &amp; Catering">
  <meta name="theme-color" content="#171310">
  <title>Old Store Cafe &amp; Catering — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#e9c893">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Image from Old Store Cafe and Catering’s current official website" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
    <nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/OldStoreCafe/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a></nav>
    <section class="home-scene__content" aria-label="Old Store Cafe &amp; Catering">
      <div class="culinary-mark" aria-label="Old Store Cafe &amp; Catering concept logo">
        <span class="utensil utensil--fork utensil--top-left" aria-hidden="true"></span>
        <span class="utensil utensil--knife utensil--top-right" aria-hidden="true"></span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">OS</span>
          <span class="pan-mark__label">FAMILY CAFE</span>
        </span>
        <span class="utensil utensil--knife utensil--bottom-left" aria-hidden="true"></span>
        <span class="utensil utensil--fork utensil--bottom-right" aria-hidden="true"></span>
      </div>

      <div class="brand-copy">
        <h1>Old Store Cafe &amp; Catering</h1>
        <p>SOUTHERN COOKING · BREAKFAST · LUNCH · CATERING</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://www.oldstorecafecatering.com/" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.oldstorecafecatering.com/" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.facebook.com/OldStoreCafe/" target="_blank" rel="noopener noreferrer">FACEBOOK</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Old+Store+Cafe+Newton+Grove+North+Carolina" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
