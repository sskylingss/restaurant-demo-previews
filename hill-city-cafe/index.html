<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Hill City Cafe">
  <meta name="theme-color" content="#171310">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23171310' stroke='%23f0d39a' stroke-width='2'/%3E%3Cpath d='M20 19v26M16 19v11c0 4 8 4 8 0V19M44 19c-6 7-6 18 0 20v6' fill='none' stroke='%23f6f0e7' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Hill City Cafe — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#d6b06d">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Conceptual Black Hills diner scene matching Hill City Cafe’s verified breakfast, burger and dinner offering" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>

    <section class="home-scene__content" aria-label="Hill City Cafe">
      <div class="culinary-mark" aria-label="Hill City Cafe concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">HC</span>
          <span class="pan-mark__label">BLACK HILLS · SOUTH DAKOTA</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
      </div>

      <div class="brand-copy">
        <h1>Hill City Cafe</h1>
        <p>BREAKFAST · BURGERS · STEAKS · PIZZA</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://www.hillcitycafe.com/menu" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://order.toasttab.com/online/hill-city-cafe-209-main-street" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://www.hillcitycafe.com/contact-us" target="_blank" rel="noopener noreferrer">CONTACT</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Hill+City+Cafe+209+Main+Street+Hill+City+SD+57745" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
