<!doctype html>
<html lang="en">
<head>

  <main class="home-scene">

    <div class="home-scene__shade" aria-hidden="true"></div>
    <nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/251535058039223" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a><a href="https://www.instagram.com/camilleshawaiianfood/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a></nav>
    <section class="home-scene__content" aria-label="Camille’s Hawaiian Food">
      <div class="culinary-mark" aria-label="Camille’s Hawaiian Food concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">CH</span>
          <span class="pan-mark__label">OHANA</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
      </div>

      <div class="brand-copy">
        <h1>Camille’s Hawaiian Food</h1>
        <p>HAWAIIAN PLATES · OHANA MEALS · TAKEOUT · EVENTS</p>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://camilleshawaiianfood.com/" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.clover.com/online-ordering/camilles-hawaiian-food-waipahu" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://camilleshawaiianfood.com/" target="_blank" rel="noopener noreferrer">EVENTS</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Camille%27s+Hawaiian+Food+Waipahu+Hawaii" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
