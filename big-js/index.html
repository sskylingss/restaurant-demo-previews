<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Big J’s BBQ &amp; Catering">
  <meta name="theme-color" content="#171310">
  <title>Big J’s BBQ &amp; Catering — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#efbd73">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Conceptual Southern barbecue spread matching Big J’s menu category" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
    
    <section class="home-scene__content" aria-label="Big J’s BBQ &amp; Catering">
      <div class="culinary-mark" aria-label="Big J’s BBQ &amp; Catering concept logo">
        <span class="utensil utensil--fork utensil--top-left" aria-hidden="true"></span>
        <span class="utensil utensil--knife utensil--top-right" aria-hidden="true"></span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">BJ</span>
          <span class="pan-mark__label">SMOKEHOUSE</span>
        </span>
        <span class="utensil utensil--knife utensil--bottom-left" aria-hidden="true"></span>
        <span class="utensil utensil--fork utensil--bottom-right" aria-hidden="true"></span>
      </div>

      <div class="brand-copy">
        <h1>Big J’s BBQ &amp; Catering</h1>
        <p>SOUTHERN BBQ · BREAKFAST · CATERING · FAMILY</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://sites.google.com/view/bigjsbbqandcatering/home" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://sites.google.com/view/bigjsbbqandcatering/home" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://sites.google.com/view/bigjsbbqandcatering/home" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Big+J%27s+Southern+Cooking+%26+Catering+Temple+Georgia" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
