<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Moya">
  <meta name="theme-color" content="#171310">
  <title>Moya — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#d9b28a">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Conceptual fine-dining presentation matching Moya’s verified chef-owned seasonal restaurant positioning" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
<nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/moyajimthorpe/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a></nav>
    <section class="home-scene__content" aria-label="Moya">
      <div class="culinary-mark" aria-label="Moya concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">M</span>
          <span class="pan-mark__label">CHEF-OWNED · JIM THORPE</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
      </div>

      <div class="brand-copy">
        <h1>Moya</h1>
        <p>SEASONAL DINING · WINE · ART · EVENINGS</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://www.jimthorpemoya.com/#menu-section" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.jimthorpemoya.com/#reservations-section" target="_blank" rel="noopener noreferrer">RESERVATIONS</a>
          <a class="home-action" href="https://www.jimthorpemoya.com/new-events" target="_blank" rel="noopener noreferrer">NEW EVENTS</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Moya+24+Race+Street+Jim+Thorpe+Pennsylvania" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
