<!doctype html>
<html lang="en">
<head>

  <title>Quite Frankly — Homepage Concept</title>

<body style="--accent:#efb5a2">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Food image selected from Quite Frankly’s current official website" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
<nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/QuiteFranklyLLC" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a><a href="https://www.instagram.com/quitefranklyllc" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a></nav>
    <section class="home-scene__content" aria-label="Quite Frankly">
      <div class="culinary-mark" aria-label="Quite Frankly concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">QF</span>
          <span class="pan-mark__label">MAD CRAZY GOOD</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>

      <div class="brand-copy">
        <h1>Quite Frankly</h1>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://quitefranklyllc.weebly.com/menu.html" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://streetfoodfinder.com/QuiteFranklyLLC" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://quitefranklyllc.weebly.com/contact.html" target="_blank" rel="noopener noreferrer">CATERING</a>
