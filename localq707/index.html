<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for LocalQ 707 at the LAB">
  <meta name="theme-color" content="#171310">
  <title>LocalQ 707 at the LAB — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#e8b45d">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Barbecue and craft beer atmosphere selected from the current LocalQ homepage" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
    <nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/lincolnavenuebrewery/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a><a href="https://www.instagram.com/lincolnavenuebreweryca/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a></nav>
    <section class="home-scene__content" aria-label="LocalQ 707 at the LAB">
      <div class="culinary-mark" aria-label="LocalQ 707 at the LAB concept logo">
        <span class="utensil utensil--fork utensil--top-left" aria-hidden="true"></span>
        <span class="utensil utensil--knife utensil--top-right" aria-hidden="true"></span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">LQ</span>
          <span class="pan-mark__label">CALISTOGA</span>
        </span>
        <span class="utensil utensil--knife utensil--bottom-left" aria-hidden="true"></span>
        <span class="utensil utensil--fork utensil--bottom-right" aria-hidden="true"></span>
      </div>

      <div class="brand-copy">
        <h1>LocalQ 707 at the LAB</h1>
        <p>BBQ · CRAFT BEER · LIVE EVENTS · CATERING</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://localq707atthelab.godaddysites.com/menu" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://localq707atthelab.godaddysites.com/hours-and-events" target="_blank" rel="noopener noreferrer">HOURS &amp; EVENTS</a>
          <a class="home-action" href="https://localq707atthelab.godaddysites.com/" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=LocalQ+707+at+the+LAB+Calistoga+California" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
