<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Henlopen Pizza Kitchen">
  <meta name="theme-color" content="#171310">
  <title>Henlopen Pizza Kitchen — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#edc57b">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Conceptual New York-style pizza scene matching Henlopen Pizza Kitchen’s menu category" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
    
    <section class="home-scene__content" aria-label="Henlopen Pizza Kitchen">
      <div class="culinary-mark" aria-label="Henlopen Pizza Kitchen concept logo">
        <span class="utensil utensil--fork utensil--top-left" aria-hidden="true"></span>
        <span class="utensil utensil--knife utensil--top-right" aria-hidden="true"></span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">HP</span>
          <span class="pan-mark__label">PIZZA KITCHEN</span>
        </span>
        <span class="utensil utensil--knife utensil--bottom-left" aria-hidden="true"></span>
        <span class="utensil utensil--fork utensil--bottom-right" aria-hidden="true"></span>
      </div>

      <div class="brand-copy">
        <h1>Henlopen Pizza Kitchen</h1>
        <p>NEW YORK PIZZA · WINGS · TAKEOUT · CATERING</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://henlopenpizzakitchen.toast.site/order/henlopenpizzakitchen" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://order.toasttab.com/online/henlopenpizzakitchen" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://henlopenpizzakitchen.toast.site/contact-us" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Henlopen+Pizza+Kitchen+Rehoboth+Beach+Delaware" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
