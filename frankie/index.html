<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Frankie Gianino’s">
  <meta name="theme-color" content="#171310">
  <title>Frankie Gianino’s — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#efd09a">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Official Frankie Gianino’s brand image" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
    <nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/dinefg" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a><a href="https://www.instagram.com/frankiegianinosimperial/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a></nav>
    <section class="home-scene__content" aria-label="Frankie Gianino’s">
      <div class="culinary-mark" aria-label="Frankie Gianino’s concept logo">
        <span class="utensil utensil--fork utensil--top-left" aria-hidden="true"></span>
        <span class="utensil utensil--knife utensil--top-right" aria-hidden="true"></span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">FG</span>
          <span class="pan-mark__label">IMPERIAL</span>
        </span>
        <span class="utensil utensil--knife utensil--bottom-left" aria-hidden="true"></span>
        <span class="utensil utensil--fork utensil--bottom-right" aria-hidden="true"></span>
      </div>

      <div class="brand-copy">
        <h1>Frankie Gianino’s</h1>
        <p>ITALIAN DINING · FAMILY MEALS · CATERING · PARTIES</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://www.dinefg.com/menu" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.dinefg.com/order-online" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://www.dinefg.com/catering-banquets" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Frankie+Gianino%27s+Imperial+Missouri" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
