<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A homepage concept for Kunnari’s Kitchen">
  <meta name="theme-color" content="#171310">
  <title>Kunnari’s Kitchen — Homepage Concept</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="--accent:#e8b0a2">
  <main class="home-scene">
    <img class="home-scene__image" src="assets/hero.webp" width="1600" height="1000" alt="Conceptual farm-to-table cafe breakfast scene matching Kunnari’s business categories" fetchpriority="high">
    <div class="home-scene__shade" aria-hidden="true"></div>
<nav class="social-links" aria-label="Social media"><a href="https://www.facebook.com/kunnaris/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">f</a><a href="https://www.instagram.com/kunnariscoffeehouse/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">ig</a></nav>
    <section class="home-scene__content" aria-label="Kunnari’s Kitchen">
      <div class="culinary-mark" aria-label="Kunnari’s Kitchen concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">KK</span>
          <span class="pan-mark__label">FARM · CAFE</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
      </div>

      <div class="brand-copy">
        <h1>Kunnari’s Kitchen</h1>
        <p>BREAKFAST · BAKERY · COFFEE · FARM MARKET</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://kunnaris-kitchen.squarespace.com/menu" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.clover.com/online-ordering/kunnaris" target="_blank" rel="noopener noreferrer">ORDER ONLINE</a>
          <a class="home-action" href="https://kunnaris-kitchen.squarespace.com/catering" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://www.google.com/maps/search/?api=1&amp;query=Kunnari%27s+Kitchen+1305+8th+Street+South+Virginia+Minnesota" target="_blank" rel="noopener noreferrer">DIRECTIONS</a>
      </nav>
      <p class="concept-note">Homepage concept · Final details can be adjusted to your preference</p>
    </section>
  </main>
</body>
</html>
