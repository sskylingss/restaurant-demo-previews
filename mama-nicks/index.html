<!doctype html>

<body style="--accent:#efc07a">
  <main class="home-scene">

    <div class="home-scene__shade" aria-hidden="true"></div>
    
    <section class="home-scene__content" aria-label="Mama Nick’s Circle Pizzeria">
      <div class="culinary-mark" aria-label="Mama Nick’s Circle Pizzeria concept logo">
        <span class="utensil utensil--fork utensil--left utensil--top-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31c4 0 7-3 7-7v7m0 0v7m0-7h4V3m0 7h4V3m0 7h4V3"/></svg>
        </span>
        <span class="utensil utensil--knife utensil--right utensil--top-right" aria-hidden="true">

        </span>
        <span class="pan-mark">
          <span class="pan-mark__monogram">MN</span>
          <span class="pan-mark__label">SINCE 1962</span>
        </span>
        <span class="utensil utensil--knife utensil--left utensil--bottom-left" aria-hidden="true">
          <svg class="utensil__icon" viewBox="0 0 52 20" focusable="false"><path d="M1 10h31C39 10 46 5 51 3v10H32c-4 0-7-1-10-3"/></svg>
        </span>
        <span class="utensil utensil--fork utensil--right utensil--bottom-right" aria-hidden="true">

        </span>
      </div>

      <div class="brand-copy">
        <h1>Mama Nick’s Circle Pizzeria</h1>
        <p>PIZZA · FAMILY RECIPES · DINNER · CATERING</p>
      </div>

      <nav class="home-actions" aria-label="Homepage actions">
        <a class="home-action" href="https://mamanickscirclepizzeria.godaddysites.com/menu" target="_blank" rel="noopener noreferrer">MENU</a>
          <a class="home-action" href="https://www.ezcater.com/catering/pvt/mama-nicks-circle-pizzeria-3" target="_blank" rel="noopener noreferrer">CATERING</a>
          <a class="home-action" href="https://mamanickscirclepizzeria.godaddysites.com/contact-us" target="_blank" rel="noopener noreferrer">CONTACT</a>
